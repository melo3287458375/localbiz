<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalBiz | Sign Up</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      background: #7c5bb7;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 32px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      color: white;
      font-size: 24px;
      font-weight: bold;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      margin-left: 22px;
      font-size: 14px;
    }

    .nav-links a:hover {
      text-decoration: underline;
    }

    /* Main */
    .container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 48px 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      padding: 32px 28px;
      border: 1px solid #e2e8f0;
    }

    .card h2 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eef2f8;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #334155;
    }

    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
    }

    .form-group input:focus {
      outline: none;
      border-color: #7c5bb7;
    }

    .role-group {
      display: flex;
      gap: 24px;
      margin-top: 6px;
    }

    .role-option {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .role-option input {
      width: 16px;
      height: 16px;
      accent-color: #7c5bb7;
    }

    .btn {
      width: 100%;
      background: #7c5bb7;
      color: white;
      border: none;
      padding: 11px;
      border-radius: 40px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    .btn:hover {
      background: #6a4a9e;
    }

    /* Footer */
    .footer {
      background: #7c5bb7;
      color: white;
      padding: 20px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .footer-left h3 {
      font-size: 20px;
    }

    .social-icons {
      font-size: 18px;
      letter-spacing: 6px;
    }

    .copyright {
      font-size: 11px;
      opacity: 0.8;
      margin-top: 6px;
    }

    @media (max-width: 650px) {
      .header {
        flex-direction: column;
        text-align: center;
      }
      .nav-links a {
        margin-left: 0;
        margin: 0 10px;
      }
      .footer {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">🍴 LocalBiz</div>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Gallery</a>
      <a href="#">About Us</a>
      <a href="#">Contact Us</a>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <h2>Create account</h2>
      <div class="subtitle">Join LocalBiz today</div>

      <form>
        <div class="form-group">
          <label>Full name</label>
          <input type="text" placeholder="John Doe" required>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" placeholder="hello@localbiz.com" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label>I am a:</label>
          <div class="role-group">
            <label class="role-option">
              <input type="radio" name="role" value="customer" checked> Customer
            </label>
            <label class="role-option">
              <input type="radio" name="role" value="owner"> Business Owner
            </label>
          </div>
        </div>

        <button type="button" class="btn">Continue →</button>
      </form>
    </div>
  </div>

  <div class="footer">
    <div class="footer-left">
      <h3>LocalBiz</h3>
    </div>
    <div>
      <div class="social-icons">📘 📸 ✖️ 🎵</div>
      <div class="copyright">Copyright 2023 LocalBiz</div>
    </div>
  </div>

</body>
</html>
